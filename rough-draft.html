<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Pizzeria</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fdf2e9; }
        #game-container { max-width: 500px; margin: auto; border: 4px solid #d35400; padding: 20px; border-radius: 15px; background: white; }
        .pizza-base { width: 200px; height: 200px; background: #f39c12; border: 10px solid #e67e22; border-radius: 50%; margin: 20px auto; position: relative; }
        .topping-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 5px; }
        button:hover { background: #2ecc71; }
        .order-box { background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Mini Pizzeria</h1>
    
    <div class="order-box">
        <h3>Customer Order:</h3>
        <p id="order-text">Press "Start" to begin!</p>
    </div>

    <div class="pizza-base">
        <div id="topping-list" class="topping-indicator"></div>
    </div>

    <div id="controls">
        <button onclick="addTopping('Pepperoni')">Add Pepperoni</button>
        <button onclick="addTopping('Mushrooms')">Add Mushrooms</button>
        <button onclick="addTopping('Olives')">Add Olives</button>
        <br><br>
        <button style="background: #e67e22;" onclick="checkOrder()">Serve Pizza!</button>
        <button style="background: #7f8c8d;" onclick="newOrder()">New Order</button>
    </div>
    
    <h2 id="feedback"></h2>
</div>

<script>
    let currentOrder = "";
    let playerPizza = [];

    function newOrder() {
        const toppings = ["Pepperoni", "Mushrooms", "Olives"];
        // Pick a random topping for the order
        currentOrder = toppings[Math.floor(Math.random() * toppings.length)];
        document.getElementById('order-text').innerText = "I want a pizza with: " + currentOrder;
        document.getElementById('feedback').innerText = "";
        playerPizza = [];
        updateDisplay();
    }

    function addTopping(topping) {
        playerPizza.push(topping);
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('topping-list').innerText = playerPizza.join(", ");
    }

    function checkOrder() {
        const feedback = document.getElementById('feedback');
        // Simple logic: Does the pizza contain the requested topping?
        if (playerPizza.includes(currentOrder)) {
            feedback.innerText = "Perfect! +$10 Tip";
            feedback.style.color = "green";
        } else {
            feedback.innerText = "Wrong toppings! The customer is angry.";
            feedback.style.color = "red";
        }
    }
</script>
</body>
</html>
